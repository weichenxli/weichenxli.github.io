<div class="cardmt-3 list-groups p-3">
  <div class="list-group col-12 mb-0">
    <table class="table-cv list-group-table" role="presentation">
      <tbody>
        {% for experience in include.experiences %}
        <tr>
          <td class="list-group-category-icon" aria-hidden="true"></td>
          <td class="list-group-name"><b>{{ experience.title }}@{{ experience.institution }}</b></td>
          <td class="list-group-school text-nowrap align-top">{{ experience.year }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
