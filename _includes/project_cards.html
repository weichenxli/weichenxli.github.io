<div class="project-cards row">
  {% for project in include.projects %}
  <div class="col-md-6 mb-3">
    <article class="card h-100">
      <div class="card-body d-flex flex-column">
        <p class="project-status">{{ project.status }}</p>
        <{{ include.heading_level }} class="project-title">{{ project.title }}</{{ include.heading_level }}>
        <p class="card-text">{{ project.description }}</p>
        <div class="project-links mt-auto">
          {% if project.publication %}
          <a href="{{ '/publications/' | relative_url }}#{{ project.publication }}" aria-label="Publication details for {{ project.title }}">Publication</a>
          {% endif %}
          {% if project.github %}
          <a href="{{ project.github }}" aria-label="{{ project.title }} on GitHub">GitHub <i class="fa-brands fa-github" aria-hidden="true"></i></a>
          {% endif %}
        </div>
      </div>
    </article>
  </div>
  {% endfor %}
</div>
